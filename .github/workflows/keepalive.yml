# Mantém o banco do Supabase ativo (o plano gratuito pausa após alguns dias sem uso)
name: Manter banco ativo

on:
  schedule:
    - cron: '17 11 * * *'   # todo dia às 08:17 (Brasília)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta simples no banco
        env:
          URL: https://dtivxqinubbwgyppqkyx.supabase.co
          KEY: sb_publishable_26axbnWqKXvvFm0x5DAAzw_gy7ckhp7
        run: |
          curl -fsS "$URL/rest/v1/units?select=id&limit=1" -H "apikey: $KEY" -o /dev/null -w "HTTP %{http_code}\n"
